<section>
    <form action="">
        <input type="text" placeholder="Filter by category" #filter />
        <button class="primary" type="button" (click)="filterRecipeTypeResults(filter.value)">Search</button>
    </form>
</section>
<section class="results">
    @for (recipeType of filteredRecipeTypeList; track $index) {
        <app-recipe-type [recipeType]="recipeType" />
    }
</section>
